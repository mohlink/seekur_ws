joy_node:
  ros__parameters:
    device_id: 0
    deadzone: 0.05
    autorepeat_rate: 20.0

teleop_twist_joy_node:            # ← changé
  ros__parameters:
    axis_linear:
      x: 1
    scale_linear:
      x: 0.3
    scale_linear_turbo:
      x: 0.5
    axis_angular:
      yaw: 0
    scale_angular:
      yaw: 0.4
    scale_angular_turbo:
      yaw: 0.7
    
    ###### Mode 1 ######
    #enable_button: 6           # L1
    #enable_turbo_button: 7     # R1

    ###### Mode 2 ######
    enable_button: 4           # L1
    enable_turbo_button: 5     # R1

    require_enable_button: true