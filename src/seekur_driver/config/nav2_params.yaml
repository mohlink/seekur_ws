# =============================================================================
# nav2_params.yaml - Parametres nav2 pour SeekurJR (N4 - map_server + AMCL)
# =============================================================================
#
# Ce fichier est la CONVENTION nav2 : tous les parametres de tous les
# noeuds nav2 vivent ici, dans une seule config qu'on passe partout.
# Pour l'instant on ne configure que map_server et amcl (N4). Les autres
# sections (planner_server, controller_server, bt_navigator, ...) seront
# ajoutees en N5 pour la navigation complete.
#
# CONVENTION frames (rappel arbre TF SeekurJR) :
#   map -> odom -> base_footprint -> base_link -> laser_frame
#   - map -> odom      : publie par AMCL (ce fichier)
#   - odom -> base_*   : publie par seekur_driver (SIP -> odom)
#   - base_footprint -> base_link : publie par robot_state_publisher (URDF)
#   - base_link -> laser_frame    : publie par robot_state_publisher (URDF)
#
# =============================================================================


# --- MAP SERVER --------------------------------------------------------------
# Charge la carte statique produite par slam_toolbox en N3 et la publie
# sur /map. QoS TRANSIENT_LOCAL par defaut : tout nouveau subscriber
# recoit la derniere carte publiee, meme s'il arrive plus tard.
map_server:
  ros__parameters:
    use_sim_time: true

    # Chemin vers le YAML de carte. Absolu pour eviter les surprises
    # avec le repertoire de travail depuis lequel le launch est lance.
    # A adapter si tu deplaces le workspace.
    yaml_filename: "/home/user/seekur_ws/maps/mine_gallery.yaml"

    # Type de topic (default: 'occupancy_grid'). Laisse par defaut.
    topic_name: "map"
    frame_id: "map"


# --- AMCL --------------------------------------------------------------------
# Adaptive Monte Carlo Localization : nuage de particules qui converge
# sur la position reelle du robot dans la carte. Publie map -> odom.
#
# Parametres calibres pour SeekurJR / monde galeries de mine :
#   - robot lent (max 0.5 m/s), on peut se permettre peu de particules
#   - long couloir droit -> augmenter update thresholds pour eviter le
#     'gel des particules' dans les zones ambigues (test en N4d)
#   - LiDAR LMS111 : 541 rays sur 270 deg -> laser_likelihood suffit
amcl:
  ros__parameters:
    use_sim_time: true

    # --- Frames et topics ---
    base_frame_id: "base_footprint"
    odom_frame_id: "odom"
    global_frame_id: "map"
    scan_topic: "scan"
    transform_tolerance: 1.0  # sec, marge pour la fusion des TF

    # --- Pose initiale (spawn Gazebo en 0,0,0) ---
    # AMCL initialise le nuage de particules ici au demarrage.
    # Le bouton '2D Pose Estimate' de RViz permettra de re-initialiser
    # a la souris pendant la balade (utile pour tester le kidnapping).
    set_initial_pose: true
    initial_pose:
      x: 0.0
      y: 0.0
      z: 0.0
      yaw: 0.0

    # --- Taille du nuage de particules ---
    # Petit = leger CPU mais moins robuste
    # Grand = meilleure convergence mais plus lourd
    # 500-2000 raisonnable pour un monde de 15x30 m
    min_particles: 500
    max_particles: 2000

    # --- Modele de mouvement (odometrie -> incertitude) ---
    # 'diff-corrected' : modele differential drive standard, adapte
    # au SeekurJR (le firmware fait la cinematique en interne, on lui
    # fait confiance sur les commandes envoyees).
    robot_model_type: "nav2_amcl::DifferentialMotionModel"
    alpha1: 0.2   # bruit rotation depuis rotation
    alpha2: 0.2   # bruit rotation depuis translation
    alpha3: 0.2   # bruit translation depuis translation
    alpha4: 0.2   # bruit translation depuis rotation
    alpha5: 0.2   # bruit translation depuis translation (omnidir)

    # --- Modele de capteur (LiDAR -> vraisemblance) ---
    # likelihood_field : rapide, adapte pour LiDAR 2D 'propre'
    # beam : plus precis mais plus lourd, utile si beaucoup de faux
    # positifs (personnes, objets mobiles) - pas notre cas en sim
    laser_model_type: "likelihood_field"
    max_beams: 60           # sous-echantillonnage : 60 sur 541 suffit
    laser_min_range: -1.0   # -1 = utilise la valeur du /scan (0.5 m)
    laser_max_range: -1.0   # -1 = utilise la valeur du /scan (20 m)
    laser_likelihood_max_dist: 2.0  # sigma pour la vraisemblance
    z_hit: 0.5
    z_short: 0.05
    z_max: 0.05
    z_rand: 0.5
    sigma_hit: 0.2

    # --- Seuils de mise a jour ---
    # AMCL ne re-echantillonne QUE si le robot a bouge d'au moins ces
    # valeurs depuis le dernier resample. Trop bas = CPU pour rien.
    # Trop haut = derive de localisation dans les longs couloirs droits.
    update_min_a: 0.2       # rad - re-echantillonne apres 0.2 rad
    update_min_d: 0.25      # m   - re-echantillonne apres 25 cm
    resample_interval: 1    # nb de mesures entre resampling

    # --- Recuperation en cas de perte (KLD sampling) ---
    # Si AMCL est 'perdu' (kidnapping), il ajoute des particules
    # aleatoires pour rebalayer l'espace. Balance a tuner.
    recovery_alpha_slow: 0.001
    recovery_alpha_fast: 0.1
    pf_err: 0.05
    pf_z: 0.99

    # --- Divers ---
    tf_broadcast: true      # publie map -> odom (fonction principale)
    save_pose_rate: 0.5     # sauve la derniere pose pour repli au restart


# --- LIFECYCLE MANAGER ------------------------------------------------------
# Meme pattern que pour slam_toolbox : les noeuds nav2 sont des
# lifecycle nodes qui ne font rien tant qu'on ne les active pas.
# Le lifecycle_manager les configure + active en batch, dans l'ordre
# donne par 'node_names'. autostart:true declenche tout au demarrage.
lifecycle_manager_localization:
  ros__parameters:
    use_sim_time: true
    autostart: true
    bond_timeout: 4.0    # sec, marge de securite pour les grands mondes
    node_names:
      - map_server       # DOIT etre active en premier (AMCL en depend)
      - amcl
