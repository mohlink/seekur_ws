# =============================================================================
# gz_bridge.yaml - Configuration du pont ROS2 <-> Gazebo Harmonic
# =============================================================================
#
# Chaque entree definit UN pont entre un topic Gazebo (gz_topic_name) et un
# topic ROS2 (ros_topic_name), avec conversion de type et direction.
#
# Directions possibles :
#   GZ_TO_ROS  : Gazebo publie -> ROS2 recoit  (capteurs, odom, joint states)
#   ROS_TO_GZ  : ROS2 publie   -> Gazebo recoit (cmd_vel)
#   BIDIRECTIONAL : les deux sens (rare)
#
# Champ special ros_frame_id : quand present, il REMPLACE le frame_id du
# message quand celui-ci traverse le pont dans le sens GZ_TO_ROS. C'est
# ce qui nous permet d'eviter le static_transform_publisher pour le LiDAR.
# =============================================================================


# --- Horloge de simulation ---------------------------------------------------
# Indispensable pour use_sim_time=true. Sans ca, tous les noeuds ROS2 restent
# sur l'horloge mur et rejettent les messages "vieux de 56 ans".
- ros_topic_name: "/clock"
  gz_topic_name: "/clock"
  ros_type_name: "rosgraph_msgs/msg/Clock"
  gz_type_name: "gz.msgs.Clock"
  direction: GZ_TO_ROS


# --- Commande de vitesse : ROS2 -> Gazebo ------------------------------------
# Twist NON stamped, coherent avec le protocole SeekurOS (pas de ros2_control).
- ros_topic_name: "/sim/cmd_vel"
  gz_topic_name: "/cmd_vel"
  ros_type_name: "geometry_msgs/msg/Twist"
  gz_type_name: "gz.msgs.Twist"
  direction: ROS_TO_GZ


# --- Odometrie du robot : Gazebo -> ROS2 -------------------------------------
- ros_topic_name: "/sim/odom"
  gz_topic_name: "/odom"
  ros_type_name: "nav_msgs/msg/Odometry"
  gz_type_name: "gz.msgs.Odometry"
  direction: GZ_TO_ROS


# --- Etats des joints (roues) : Gazebo -> ROS2 -------------------------------
# Le plugin JointStatePublisher publie sur ce chemin complet cote Gazebo,
# on le renomme en /joint_states cote ROS2 (que robot_state_publisher ecoute).
- ros_topic_name: "/joint_states"
  gz_topic_name: "/world/empty/model/seekur_jr/joint_state"
  ros_type_name: "sensor_msgs/msg/JointState"
  gz_type_name: "gz.msgs.Model"
  direction: GZ_TO_ROS


# --- LiDAR : Gazebo -> ROS2 --------------------------------------------------
# NOTE (teste 2026-08) : le champ ros_frame_id est IGNORE par ros_gz_bridge
# 1.0.x (ROS2 Jazzy) - il n'a pas ete retroporte depuis Rolling. Le frame_id
# reste donc l'auto-genere Gazebo (seekur_jr/base_footprint/laser_scanner).
# On le laisse ici comme documentation d'intention : sur une version plus
# recente du bridge, il s'activera et le static_transform_publisher
# 'lidar_frame_alias' du launch pourra etre supprime.
- ros_topic_name: "/scan"
  gz_topic_name: "/scan"
  ros_type_name: "sensor_msgs/msg/LaserScan"
  gz_type_name: "gz.msgs.LaserScan"
  direction: GZ_TO_ROS
# frame_id gere a la source via gz_frame_id dans le xacro. /clock et /joint_states ne bougent pas

# --- IMU : capteur inertiel du robot (public, existe aussi sur vrai robot) ---
- ros_topic_name: "/imu/data"
  gz_topic_name: "/imu/data"
  ros_type_name: "sensor_msgs/msg/Imu"
  gz_type_name: "gz.msgs.IMU"
  direction: GZ_TO_ROS


# =============================================================================
# --- CAMERA RealSense D455 : Gazebo -> ROS2 ---------------------------------
# =============================================================================
#
# Un seul capteur rgbd_camera cote Gazebo produit 4 topics (color, depth,
# points, camera_info) sous le prefixe /camera/. On les renomme cote ROS
# pour matcher les topics natifs du driver realsense2_camera - ainsi le
# passage sim -> real ne demandera aucun changement des configs YOLO/
# RTAB-Map en aval (meme philosophie que /odom public en N2).
#
# frame_id des messages : force a "camera_optical_frame" via gz_frame_id
# dans le xacro. La convention optique (Z vers la scene) est celle que
# tous les drivers ROS de camera utilisent.
#
# TOPICS SIM (Gazebo)              -> TOPICS ROS (realsense2_camera style)
#   /camera/image                  -> /camera/color/image_raw
#   /camera/depth_image            -> /camera/depth/image_rect_raw
#   /camera/points                 -> /camera/depth/color/points
#   /camera/camera_info            -> /camera/color/camera_info
#
# NOTE : Gazebo publie UN SEUL camera_info commun RGB+depth. Le vrai driver
# publie deux camera_info separes (color et depth). Simplification acceptable
# en sim ; si un consommateur exige /camera/depth/camera_info specifiquement,
# ajouter un second bridge sur le meme topic Gazebo avec renommage different.
# =============================================================================

# --- RGB image ---------------------------------------------------------------
- ros_topic_name: "/camera/color/image_raw"
  gz_topic_name: "/camera/image"
  ros_type_name: "sensor_msgs/msg/Image"
  gz_type_name: "gz.msgs.Image"
  direction: GZ_TO_ROS

# --- Depth image (aligne sur RGB par le capteur rgbd_camera Gazebo) ----------
- ros_topic_name: "/camera/depth/image_rect_raw"
  gz_topic_name: "/camera/depth_image"
  ros_type_name: "sensor_msgs/msg/Image"
  gz_type_name: "gz.msgs.Image"
  direction: GZ_TO_ROS

# --- Point cloud (depth reprojete + couleur par point) -----------------------
- ros_topic_name: "/camera/depth/color/points"
  gz_topic_name: "/camera/points"
  ros_type_name: "sensor_msgs/msg/PointCloud2"
  gz_type_name: "gz.msgs.PointCloudPacked"
  direction: GZ_TO_ROS

# --- Camera info (intrinseques : fx, fy, cx, cy, distortion) -----------------
# Gazebo publie un camera_info commun ; on l'expose comme celui de la RGB
# (usage principal en YOLO). Pour RTAB-Map qui peut vouloir depth/camera_info,
# ajouter un second bridge sur /camera/camera_info avec renommage different.
- ros_topic_name: "/camera/color/camera_info"
  gz_topic_name: "/camera/camera_info"
  ros_type_name: "sensor_msgs/msg/CameraInfo"
  gz_type_name: "gz.msgs.CameraInfo"
  direction: GZ_TO_ROS
