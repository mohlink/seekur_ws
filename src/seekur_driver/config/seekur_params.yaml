seekur_driver:
  ros__parameters:
    # Communication série
    serial_port: "/dev/seekur"
    baud_rate: 9600
    timeout: 0.5
    
    cmd_timeout: 0.5   # s ; plus de /cmd_vel -> arret de securite (reemis 3 fois)   

    # Frames
    base_frame: "base_footprint"
    odom_frame: "odom"
    
    # Limites de vitesse
    max_linear_vel: 2.0    # m/s
    max_angular_vel: 3.14  # rad/s
    
    # Paramètres physiques robot
    wheel_separation: 0.663  # m (SeekurJR)
    
    # Publishing
    publish_tf: true
    odom_freq: 10.0        # Hz
    battery_freq: 1.0      # Hz
    diagnostics_freq: 1.0  # Hz
    
    # Debug
    verbose: false