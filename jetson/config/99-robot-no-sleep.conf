# Destination : /etc/systemd/logind.conf.d/99-robot-no-sleep.conf
# Complète le masquage des cibles systemd (sleep/suspend/hibernate/hybrid-sleep).
# Pris en compte au redémarrage (ne pas redémarrer systemd-logind en SSH).
[Login]
IdleAction=ignore
HandleSuspendKey=ignore
HandleHibernateKey=ignore
HandleLidSwitch=ignore
HandleLidSwitchExternalPower=ignore
