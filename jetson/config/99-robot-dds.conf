# Destination : /etc/sysctl.d/99-robot-dds.conf
# Gros messages DDS (nuage de points RealSense : plusieurs Mo par message).
# Defaut Ubuntu : rmem_max = 208 Ko -> le nuage n'arrive jamais en RELIABLE.
# Valeurs recommandees par la doc ROS 2 (DDS tuning) pour CycloneDDS.
net.core.rmem_max = 2147483647
net.ipv4.ipfrag_time = 3
net.ipv4.ipfrag_high_thresh = 134217728
