# Destination : /etc/sysctl.d/99-robot-arp.conf
# Jetson multi-interface : chaque carte ne répond en ARP que pour sa propre IP.
# Sans ça (constaté 2026-09-26) : Ethernet et WiFi sur le même sous-réseau,
# l'Ethernet répondait pour l'IP WiFi -> NetworkManager détecte un "conflit"
# avec sa propre MAC Ethernet -> IP WiFi retirée ~5 min -> SSH et DDS coupés.
net.ipv4.conf.all.arp_ignore = 1
net.ipv4.conf.all.arp_announce = 2
