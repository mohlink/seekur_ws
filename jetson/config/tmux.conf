# Destination : ~/.tmux.conf   (facultatif, confort)
# Molette pour faire défiler, clic pour changer de volet ou de fenêtre.
# Copier vers Windows : Shift + sélection. Coller : Ctrl+Shift+V.
set -g mouse on
set -g history-limit 50000
# Découpage avec des touches accessibles sur tout clavier (" est introuvable en CA-FR)
bind - split-window -v
bind | split-window -h
