# Destination : /etc/NetworkManager/conf.d/zz-wifi-powersave-off.conf
#
# ATTENTION AU NOM : NetworkManager lit conf.d par ordre alphabétique, le
# dernier lu l'emporte. Les chiffres passent AVANT les lettres : un fichier
# "99-..." serait écrasé par "default-wifi-powersave-on.conf" d'Ubuntu.
# Vérifier : NetworkManager --print-config | grep powersave  -> 2
[connection]
# 2 = désactivé : évite la latence irrégulière sur /cmd_vel et la téléop
wifi.powersave = 2
